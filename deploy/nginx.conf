server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a proxy, nginx must not build redirects from its own host and
    # port. Without this, asking for /security lands the visitor on
    # http://container:3000/security/ instead of the site they were reading.
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    # The export uses trailing slashes, so every page is a directory holding
    # an index.html. try_files falls through to it, which re-enters location
    # matching as a request for the .html file below.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Next fingerprints these filenames, so a change makes a new URL and the
    # old one can be kept for as long as anyone still asks for it.
    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Screenshots and the icon keep their names across releases, so they get a
    # short life rather than an immutable one: long enough to save the repeat
    # visit, short enough that replacing one is visible the same day.
    location ~* \.(png|svg|ico|webp|jpg)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # The HTML never is. A cached page would keep announcing an old version,
    # and this is the page people read before downloading a vault.
    location ~* \.html$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
}
