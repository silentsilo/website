# Included into every block that sets a header of its own, because nginx
# drops inherited add_header directives the moment a location declares one.
# Serving these from the server block alone silently loses them on exactly
# the pages people read.

# The site fetches nothing from anywhere else, and /privacy says so. This is
# that sentence enforced by the server instead of asserted in prose. Inline
# script and style are allowed because Next inlines its hydration payload
# into the exported HTML, which a static build cannot avoid.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
