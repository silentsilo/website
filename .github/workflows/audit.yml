name: Audit

# High and critical npm advisories, with reasoned ignores in
# scripts/npm-audit.mjs. Apart from the deploy on purpose: a new advisory
# should turn this red, not hold back a fix to the site. Weekly as well,
# since advisories appear without a push.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: node scripts/npm-audit.mjs
