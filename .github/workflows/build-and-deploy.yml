name: Build and Deploy

# Whatever this workflow builds becomes the site people download an encrypted
# vault from, so the actions below are pinned to commits rather than to moving
# tags. A tag can be repointed by whoever controls the action's repository; a
# commit cannot. The version after each pin is what that commit was tagged as
# when it was chosen, so the next person can tell how far behind it has
# drifted without resolving the hash.
#
# Moved forward on 8 September 2026 because the previous set ran on Node 20,
# which GitHub is retiring; every deploy was logging the deprecation. The
# `docker/*` majors crossed here add a build summary and drop two environment
# variables this workflow never set.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on one image: `latest` for the deployment to follow, and the
      # commit, so the running build can be named and rolled back to.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/silentsilo/website:latest
            ghcr.io/silentsilo/website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Comma-separated, so several targets can be redeployed from one push.
      # Skipped rather than failed when unset: a build that pushed a good
      # image should not go red because no deployment is wired up yet.
      - name: Trigger Coolify deploy
        env:
          WEBHOOKS: ${{ secrets.COOLIFY_WEBHOOKS }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOKS" ]; then
            echo "No COOLIFY_WEBHOOKS set, nothing to deploy to."
            exit 0
          fi
          IFS=',' read -ra HOOKS <<< "$WEBHOOKS"
          for hook in "${HOOKS[@]}"; do
            hook=$(echo "$hook" | xargs)
            [ -z "$hook" ] && continue
            echo "Triggering deploy hook"
            if [ -n "$COOLIFY_API_TOKEN" ]; then
              curl -fsS -X GET "$hook" -H "Authorization: Bearer $COOLIFY_API_TOKEN"
            else
              curl -fsS -X GET "$hook"
            fi
          done
